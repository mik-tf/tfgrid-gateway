---
# Global configuration
ansible_python_interpreter: /usr/bin/python3

# Network configuration
network_cidr: "10.1.0.0/16"
wireguard_port: 51820
network_mode: "{{ lookup('env', 'NETWORK_MODE') | default('wireguard-only', true) }}"
disable_port_forwarding: "{{ lookup('env', 'DISABLE_PORT_FORWARDING') | default('false', true) | lower }}"
gateway_type: "{{ lookup('env', 'GATEWAY_TYPE') | default('gateway_nat', true) }}"

# ThreeFold Grid network
tfgrid_network: "test"

# Mycelium configuration
mycelium_enabled: "{{ lookup('env', 'INTER_NODE_NETWORK') | default('wireguard', true) == 'mycelium' }}"

# HAProxy proxy ports (dynamic - one port per VM, starting from 8080)
# Similar to NAT gateway: 8080->VM1, 8081->VM2, 8082->VM3, etc.
proxy_ports: "{{ (groups['internal'] | default([]) | length) | range(8080, 8080 + (groups['internal'] | default([]) | length) - 1) | list if (groups['internal'] | default([]) | length) > 0 else [] }}"
